- name: "Fleet Decarbonization Planning (Shell.ai Hackathon)"
  tag: "Top 20 globally"
  # url: ""
  description: "Team of four. MILP in Pyomo/Gurobi for a 16-year transition from diesel to LNG and battery-electric trucks, minimizing total cost under yearly carbon caps, demand by size and distance class, vehicle lifetimes, and a 20% annual sales limit. I built the Streamlit dashboard for comparing three fuel-price scenarios."